# Local Postgres for the source store.
#
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/command_center bun run db:migrate
#
# The store's own tests do NOT use this: they start a throwaway container per run, so a
# checkout with Docker available needs no setup at all. This is for running the app.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: command_center
    ports:
      - '5432:5432'
    volumes:
      - command-center-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  # A local Azure: ARM, Monitor and Entra, so @azure/identity authenticates against it and
  # the provider talks to it exactly as it would to the real thing. Only the endpoint
  # differs, which is what makes an end-to-end run exercise the production code path.
  #
  # It mounts the host Docker socket because it provisions real containers for the
  # stateful services it emulates. That is the project's documented way to run it, and it
  # is worth knowing: a container with the host socket can start other containers.
  #
  # Cost Management is not emulated, so `cloud.cost` is served by our own mock — see
  # src/lib/server/sources/providers/azure/mock/cost.ts, started by `bun run dev:stack`.
  floci-az:
    image: floci/floci-az:latest
    ports:
      - '4577:4577'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  command-center-pgdata:
